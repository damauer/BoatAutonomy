<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Development, test, and field pipeline</title>
  <desc id="desc">A dark public-safe diagram showing BCH bench work feeding STG, QST, sensor evidence, an evolving twin, and a parallel TVL DevOps survey lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#241307"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrowb" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrowt" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.label{font:800 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}.box{stroke-width:1.6}.blue{fill:#0b2a55;stroke:#38bdf8}.teal{fill:#073b37;stroke:#34d399}.orange{fill:#45220a;stroke:#f97316}.purple{fill:#2b174c;stroke:#a78bfa}.lineb{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrowb)}.linet{stroke:#34d399;stroke-width:4;fill:none;marker-end:url(#arrowt)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="82" class="title">Development, Test, And Field Pipeline</text>
  <text x="82" y="122" class="sub">Survey evidence feeds the twin; replay validates changes before promotion</text>

  <rect x="80" y="175" width="270" height="560" rx="24" class="panel"/>
  <text x="115" y="222" class="h">BCH Bench</text>
  <text x="115" y="260" class="s">Design, schemas, synthetic</text><text x="115" y="284" class="s">data, captures, replay,</text><text x="115" y="308" class="s">and pre-change review.</text>
  <rect x="115" y="355" width="180" height="40" rx="13" class="box blue"/><text x="158" y="381" class="s">Terraform</text>
  <rect x="115" y="410" width="180" height="40" rx="13" class="box teal"/><text x="166" y="436" class="s">Ansible</text>
  <rect x="115" y="465" width="180" height="40" rx="13" class="box orange"/><text x="155" y="491" class="s">cloud-init</text>
  <rect x="115" y="590" width="200" height="64" rx="16" class="box purple"/><text x="139" y="623" class="s">promote only</text><text x="139" y="647" class="tiny">with evidence</text>

  <rect x="420" y="165" width="1100" height="315" rx="28" class="panel"/>
  <text x="455" y="212" class="h">Physical Validation Lane</text>
  <text x="455" y="244" class="s">Bench assumptions move toward hardware evidence without turning dashboards into control authority.</text>
  <rect x="455" y="300" width="170" height="92" rx="16" class="box blue"/><text x="507" y="334" class="label">STG</text><text x="492" y="362" class="s">integration</text>
  <rect x="705" y="300" width="190" height="92" rx="16" class="box teal"/><text x="745" y="334" class="label">QST Case</text><text x="742" y="362" class="s">portable/fixed</text>
  <rect x="975" y="300" width="210" height="92" rx="16" class="box orange"/><text x="1014" y="334" class="label">SeaTalk NG</text><text x="1015" y="362" class="s">NMEA 2000 sensors</text>
  <rect x="1270" y="300" width="190" height="92" rx="16" class="box purple"/><text x="1310" y="334" class="label">Twin Inputs</text><text x="1302" y="362" class="s">survey evidence</text>
  <path d="M350 330 C382 330 392 330 420 330" class="linet"/><path d="M625 346 L705 346" class="linet"/><path d="M895 346 L975 346" class="linet"/><path d="M1185 346 L1270 346" class="linet"/>

  <rect x="420" y="535" width="1100" height="300" rx="28" class="panel"/>
  <text x="455" y="582" class="h">TVL DevOps And Survey Lane</text>
  <text x="455" y="614" class="s">The travel stack proves field development, observability, replay, and remote troubleshooting mechanics.</text>
  <rect x="455" y="665" width="170" height="92" rx="16" class="box blue"/><text x="510" y="699" class="label">TVL</text><text x="488" y="727" class="s">Lima vz</text>
  <rect x="705" y="665" width="190" height="92" rx="16" class="box teal"/><text x="755" y="699" class="label">K8s</text><text x="742" y="727" class="s">Flux / GitOps</text>
  <rect x="975" y="665" width="210" height="92" rx="16" class="box orange"/><text x="1018" y="699" class="label">Telemetry</text><text x="1004" y="725" class="s">SignalK / InfluxDB</text><text x="1004" y="747" class="tiny">Grafana survey views</text>
  <rect x="1270" y="665" width="190" height="92" rx="16" class="box purple"/><text x="1306" y="699" class="label">Validate</text><text x="1306" y="727" class="s">replay before live</text>
  <path d="M350 706 C382 706 392 706 420 706" class="lineb"/><path d="M625 711 L705 711" class="lineb"/><path d="M895 711 L975 711" class="lineb"/><path d="M1185 711 L1270 711" class="lineb"/>

  <path d="M1370 392 C1380 505 1350 590 1285 630 C1235 674 1148 674 1060 665" class="dash"/>
  <rect x="80" y="800" width="270" height="110" rx="20" fill="#073b37" stroke="#34d399" stroke-width="1.6"/><text x="115" y="842" class="label">Future Apps</text><text x="115" y="872" class="s">Go / Rust collectors</text><text x="115" y="896" class="s">WASM only if measured</text>
  <rect x="420" y="875" width="1100" height="70" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.6"/><text x="455" y="917" class="h">The pipeline turns field evidence into repeatable twin inputs before promotion.</text>
</svg>
