<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GitLab-centered agentic engineering workflow</title>
  <desc id="desc">A dark public-safe diagram showing GitLab records, YAML policy, Markdown decisions, docs, tmux observable collaboration, and research through closure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#06251f"/></linearGradient>
    <linearGradient id="git" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="0.58" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}.line{stroke:#34d399;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="82" class="title">Agentic Engineering In GitLab</text>
  <text x="82" y="122" class="sub">Policy, observable collaboration, review records, and closure are engineering artifacts</text>

  <rect x="90" y="185" width="330" height="225" rx="24" class="panel"/><text x="125" y="232" class="h">Agent Roles</text><text x="125" y="270" class="s">Grok researches.</text><text x="125" y="298" class="s">Claude implements.</text><text x="125" y="326" class="s">Codex reviews.</text><text x="125" y="354" class="s">Owner approves scope and risk.</text>
  <rect x="90" y="480" width="330" height="205" rx="24" class="panel"/><text x="125" y="528" class="h">tmux Observable Work</text><text x="125" y="566" class="s">Sessions remain visible,</text><text x="125" y="592" class="s">resumable, and reviewable</text><text x="125" y="618" class="s">without publishing transcripts.</text>

  <rect x="500" y="170" width="760" height="300" rx="30" fill="url(#git)" filter="url(#shadow)"/>
  <text x="545" y="222" class="h">GitLab Work System</text>
  <text x="545" y="258" class="s" style="fill:#eef2ff">Issues, MRs, milestones, commits, reviews, evidence records, and owner decisions hold shared state.</text>
  <rect x="555" y="310" width="170" height="60" rx="16" fill="#111827" opacity="0.92" stroke="#f97316"/><text x="605" y="347" class="label">YAML</text>
  <rect x="795" y="310" width="190" height="60" rx="16" fill="#111827" opacity="0.92" stroke="#34d399"/><text x="840" y="347" class="label">Markdown</text>
  <rect x="1055" y="310" width="150" height="60" rx="16" fill="#111827" opacity="0.92" stroke="#38bdf8"/><text x="1104" y="347" class="label">Docs</text>
  <rect x="555" y="400" width="650" height="44" rx="14" fill="#0f172a" opacity="0.9"/><text x="585" y="428" class="s">scope -> artifact -> verification -> finding -> decision -> residual risk</text>
  <path d="M420 300 C455 300 470 300 500 300" class="line"/><path d="M420 582 C485 582 480 423 555 423" class="line"/>

  <rect x="1320" y="185" width="190" height="225" rx="24" class="panel"/><text x="1352" y="232" class="h">Closure</text><text x="1352" y="270" class="s">Accepted, blocked,</text><text x="1352" y="296" class="s">deferred, or carried</text><text x="1352" y="322" class="s">with owner context.</text>
  <path d="M1260 320 C1290 320 1300 320 1320 320" class="line"/>

  <rect x="500" y="560" width="1010" height="245" rx="26" class="panel"/>
  <text x="540" y="608" class="h">Delivery Loop</text><text x="540" y="640" class="s">A work item advances only when evidence and review support the next state.</text>
  <rect x="540" y="690" width="150" height="62" rx="16" fill="#073b37" stroke="#34d399"/><text x="575" y="727" class="label">Research</text>
  <rect x="735" y="690" width="180" height="62" rx="16" fill="#0b2a55" stroke="#38bdf8"/><text x="760" y="727" class="label">Implementation</text>
  <rect x="960" y="690" width="145" height="62" rx="16" fill="#2b174c" stroke="#a78bfa"/><text x="1000" y="727" class="label">Review</text>
  <rect x="1150" y="690" width="190" height="62" rx="16" fill="#45220a" stroke="#f97316"/><text x="1182" y="727" class="label">Reconciliation</text>
  <rect x="1385" y="690" width="95" height="62" rx="16" fill="#45132e" stroke="#f472b6"/><text x="1403" y="727" class="label">Close</text>
  <path d="M690 721 L735 721" class="line"/><path d="M915 721 L960 721" class="line"/><path d="M1105 721 L1150 721" class="line"/><path d="M1340 721 L1385 721" class="line"/>
  <path d="M1032 690 C970 654 770 654 660 690" class="dash"/>
  <rect x="776" y="654" width="296" height="28" rx="10" fill="#111827" opacity="0.96"/>
  <text x="790" y="674" class="tiny">review may return work to an earlier state</text>

  <rect x="90" y="825" width="1420" height="70" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.6"/>
  <text x="125" y="866" class="h">Speed comes from agent specialization; trust comes from recorded evidence and explicit closure.</text>
</svg>
