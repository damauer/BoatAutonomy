<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GitLab-centered agentic engineering workflow</title>
  <desc id="desc">A public-safe diagram showing GitLab as the shared evidence and planning system, YAML policy flowing into Markdown records and docs, tmux observable collaboration, and Claude, Codex, and Grok moving work from research through implementation, review, reconciliation, and closure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.52" stop-color="#eefdf7"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="gitlab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <style>
      .title { font: 800 50px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .section { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .section-light { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .label { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label-light { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .small-light { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eef2ff; letter-spacing: 0; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #dbe7ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .chip-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.6; rx: 14; }
      .chip-teal { fill: #ccfbf1; stroke: #5eead4; stroke-width: 1.6; rx: 14; }
      .chip-orange { fill: #ffedd5; stroke: #fdba74; stroke-width: 1.6; rx: 14; }
      .chip-purple { fill: #ede9fe; stroke: #a78bfa; stroke-width: 1.6; rx: 14; }
      .chip-pink { fill: #fce7f3; stroke: #f9a8d4; stroke-width: 1.6; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-teal { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow-teal); }
      .line-orange { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); }
      .dash { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1325" cy="125" r="155" fill="#dbeafe" opacity="0.48"/>
  <circle cx="220" cy="825" r="170" fill="#ccfbf1" opacity="0.42"/>
  <circle cx="1405" cy="835" r="120" fill="#fed7aa" opacity="0.33"/>

  <text x="80" y="82" class="title">Agentic Engineering In GitLab</text>
  <text x="82" y="122" class="subtitle">Policy, observable collaboration, review records, and closure are treated as first-class engineering artifacts</text>

  <rect x="80" y="170" width="375" height="270" class="card"/>
  <text x="112" y="214" class="section">Agent Roles</text>
  <text x="112" y="248" class="small">Specialized agents do bounded work.</text>
  <rect x="112" y="278" width="280" height="42" class="chip-teal"/>
  <text x="136" y="305" class="small">Grok: domain and build research</text>
  <rect x="112" y="334" width="280" height="42" class="chip-blue"/>
  <text x="136" y="361" class="small">Claude Code: implementation</text>
  <rect x="112" y="390" width="280" height="42" class="chip-purple"/>
  <text x="136" y="417" class="small">Codex: independent review</text>

  <rect x="80" y="490" width="375" height="225" class="card"/>
  <text x="112" y="534" class="section">Observable Collaboration</text>
  <text x="112" y="568" class="small">Long-running sessions stay visible,</text>
  <text x="112" y="592" class="small">resumable, and reviewable.</text>
  <rect x="112" y="626" width="280" height="42" class="chip-purple"/>
  <text x="150" y="653" class="small">tmux session evidence</text>
  <text x="112" y="694" class="tiny">Public-safe: no transcripts or endpoints.</text>

  <rect x="520" y="160" width="760" height="335" rx="28" fill="url(#gitlab)" filter="url(#shadow)"/>
  <text x="555" y="207" class="section-light">GitLab Work System</text>
  <text x="555" y="240" class="small-light">Issues, merge requests, milestones, commits, reviews, and evidence records hold the shared state.</text>

  <rect x="565" y="278" width="190" height="72" class="chip-orange"/>
  <text x="618" y="308" class="label">YAML</text>
  <text x="600" y="334" class="small">policy gates</text>
  <rect x="810" y="278" width="190" height="72" class="chip-teal"/>
  <text x="858" y="308" class="label">Markdown</text>
  <text x="845" y="334" class="small">decisions</text>
  <rect x="1055" y="278" width="180" height="72" class="chip-blue"/>
  <text x="1116" y="308" class="label">Docs</text>
  <text x="1088" y="334" class="small">public shape</text>
  <path d="M755 314 L810 314" class="line-orange"/>
  <path d="M1000 314 L1055 314" class="line-teal"/>

  <rect x="565" y="390" width="670" height="64" rx="18" fill="#ffffff" opacity="0.92"/>
  <text x="596" y="416" class="label">Evidence Thread</text>
  <text x="596" y="442" class="small">scope -> artifact -> verification -> finding -> decision -> residual risk</text>

  <path d="M455 305 C485 305 498 305 520 305" class="line-teal"/>
  <path d="M455 640 C500 640 505 440 565 440" class="line-blue"/>

  <rect x="1320" y="170" width="200" height="270" class="card"/>
  <text x="1352" y="214" class="section">Owner Gate</text>
  <text x="1352" y="248" class="small">Owner sets scope,</text>
  <text x="1352" y="272" class="small">accepts risk, and</text>
  <text x="1352" y="296" class="small">approves public</text>
  <text x="1352" y="320" class="small">publication.</text>
  <rect x="1352" y="358" width="126" height="42" class="chip-pink"/>
  <text x="1378" y="385" class="small">approval</text>
  <path d="M1280 305 C1300 305 1308 305 1320 305" class="line-orange"/>

  <rect x="505" y="560" width="960" height="260" class="card"/>
  <text x="540" y="605" class="section">Delivery Loop</text>
  <text x="540" y="635" class="small">The same work item advances only when evidence and review support the next state.</text>

  <rect x="540" y="675" width="150" height="72" class="chip-teal"/>
  <text x="574" y="705" class="label">Research</text>
  <text x="572" y="731" class="small">sources + fit</text>
  <rect x="735" y="675" width="180" height="72" class="chip-blue"/>
  <text x="768" y="705" class="label">Implementation</text>
  <text x="776" y="731" class="small">bounded change</text>
  <rect x="960" y="675" width="145" height="72" class="chip-purple"/>
  <text x="1001" y="705" class="label">Review</text>
  <text x="990" y="731" class="small">findings</text>
  <rect x="1150" y="675" width="190" height="72" class="chip-orange"/>
  <text x="1184" y="705" class="label">Reconciliation</text>
  <text x="1192" y="731" class="small">fix or carry</text>
  <rect x="1385" y="675" width="118" height="72" class="chip-pink"/>
  <text x="1410" y="705" class="label">Closure</text>
  <text x="1408" y="731" class="small">decision</text>

  <path d="M690 711 L735 711" class="line-teal"/>
  <path d="M915 711 L960 711" class="line-blue"/>
  <path d="M1105 711 L1150 711" class="line-orange"/>
  <path d="M1340 711 L1385 711" class="line-orange"/>
  <path d="M1032 675 C1028 605 850 572 660 675" class="dash"/>
  <text x="820" y="662" class="tiny">review may return work to an earlier state</text>

  <path d="M900 495 C900 525 900 542 900 560" class="line-blue"/>
  <path d="M1420 440 C1420 520 1444 590 1444 675" class="line-orange"/>

  <rect x="80" y="790" width="375" height="120" rx="20" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
  <text x="112" y="828" class="label">Public Boundary</text>
  <text x="112" y="858" class="small">Process shape is visible.</text>
  <text x="112" y="882" class="small">Private transcripts, endpoints,</text>
  <text x="112" y="906" class="small">and raw data stay out of GitHub.</text>

  <rect x="505" y="860" width="960" height="74" rx="22" fill="url(#flow)" filter="url(#shadow)"/>
  <text x="540" y="894" class="section-light">Closure Means A Recorded Decision</text>
  <text x="540" y="920" class="small-light">accepted, blocked, deferred, or carried with explicit owner context</text>
</svg>
