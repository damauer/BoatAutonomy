<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy safety boundary</title>
  <desc id="desc">A dark public-safe diagram separating current claims from non-claims and showing the gated path to any future supervised assistance.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#2b0b16"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}</style></defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Safety Boundary</text><text x="82" y="126" class="sub">The project can explore assistance, but it cannot skip from demos to live vessel authority</text>
  <rect x="95" y="210" width="420" height="360" rx="28" class="panel"/><text x="135" y="264" class="h">Current Claims</text><text x="135" y="316" class="s">Capture and decode telemetry</text><text x="135" y="354" class="s">Replay and inspect sessions</text><text x="135" y="392" class="s">Use edge services for evidence</text><text x="135" y="430" class="s">Use agents for bounded work</text><text x="135" y="468" class="s">Document decisions and approvals</text>
  <rect x="590" y="210" width="420" height="360" rx="28" class="panel"/><text x="630" y="264" class="h">Non-Claims</text><text x="630" y="316" class="s">No unattended docking claim</text><text x="630" y="354" class="s">No AI control of a live vessel</text><text x="630" y="392" class="s">No Kubernetes safety controller</text><text x="630" y="430" class="s">No dashboard physical override</text><text x="630" y="468" class="s">No public actuator runbook</text>
  <rect x="1085" y="210" width="420" height="360" rx="28" class="panel"/><text x="1125" y="264" class="h">Future Assist Requires</text><text x="1125" y="316" class="s">Operator enable and override</text><text x="1125" y="354" class="s">Freshness and validity checks</text><text x="1125" y="392" class="s">Rate limits and watchdogs</text><text x="1125" y="430" class="s">Safe-state fault handling</text><text x="1125" y="468" class="s">Explicit review and approval</text>
  <rect x="95" y="690" width="1410" height="92" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.6" filter="url(#shadow)"/><text x="135" y="746" class="h">Takeaway: assistance is allowed to earn trust; authority remains gated, deterministic, and owner-controlled.</text>
</svg>
