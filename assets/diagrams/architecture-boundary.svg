<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Staged architecture and safety boundary</title>
  <desc id="desc">A dark public-safe diagram showing observe, replay, evidence, shadow, and assist stages with the hard real-time safety boundary kept separate.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#06251f"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}.line{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Staged Architecture</text><text x="82" y="126" class="sub">The system earns authority in stages; telemetry and AI stay outside the hard real-time safety loop</text>
  <rect x="90" y="210" width="250" height="180" rx="24" class="panel"/><text x="128" y="260" class="h">Vessel Interface</text><text x="128" y="302" class="s">read-only marine bus tap</text><text x="128" y="330" class="s">sensor freshness checks</text>
  <rect x="430" y="210" width="250" height="180" rx="24" class="panel"/><text x="468" y="260" class="h">Edge Runtime</text><text x="468" y="302" class="s">capture, timestamp, decode</text><text x="468" y="330" class="s">normalize, store, replay</text>
  <rect x="770" y="210" width="250" height="180" rx="24" class="panel"/><text x="808" y="260" class="h">Platform Plane</text><text x="808" y="302" class="s">dashboards, queries, CI</text><text x="808" y="330" class="s">evidence and reviews</text>
  <rect x="1110" y="210" width="250" height="180" rx="24" class="panel"/><text x="1148" y="260" class="h">Shadow / Assist</text><text x="1148" y="302" class="s">propose, compare, gate</text><text x="1148" y="330" class="s">no authority without review</text>
  <path d="M340 300 L430 300" class="line"/><path d="M680 300 L770 300" class="line"/><path d="M1020 300 L1110 300" class="line"/>
  <rect x="210" y="530" width="1180" height="190" rx="28" fill="#0f172a" stroke="#334155" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="250" y="584" class="h">Hard Boundary</text><text x="250" y="626" class="s">Kubernetes, dashboards, agents, and models can observe, replay, estimate, and recommend.</text><text x="250" y="656" class="s">They do not become the hard real-time safety controller.</text>
  <rect x="1045" y="575" width="265" height="76" rx="18" fill="#45132e" stroke="#f472b6" stroke-width="1.6"/><text x="1086" y="620" class="h">Owner + Override</text>
  <rect x="90" y="800" width="1420" height="70" rx="22" fill="#111827" stroke="#263244" stroke-width="1.6"/><text x="130" y="842" class="h">Takeaway: the public architecture is about staged evidence, not a claim of live autonomous control.</text>
</svg>
