<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy docking system evolution</title>
  <desc id="desc">A public-safe dark diagram showing a Conquest-style boat coming alongside a dock, sensor data flowing into an edge cluster, the captain in the loop, and future gated control paths for throttle, steering angle, emergency assist, and docking research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#10251f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.58" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="dockWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3f1d"/>
      <stop offset="0.55" stop-color="#7c4a21"/>
      <stop offset="1" stop-color="#3b250f"/>
    </linearGradient>
    <linearGradient id="darkHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243244"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="cluster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowData" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowSense" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowControl" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowHuman" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
    <style>
      .title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc;letter-spacing:0}
      .sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1;letter-spacing:0}
      .h{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc;letter-spacing:0}
      .h2{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc;letter-spacing:0}
      .s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1;letter-spacing:0}
      .tiny{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8;letter-spacing:0}
      .mono{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0}
      .panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}
      .chip{fill:#172338;stroke:#334155;stroke-width:1.4}
      .plannedChip{fill:#1f2937;stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 5;opacity:0.82}
      .data{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrowData);stroke-linecap:round}
      .sense{stroke:#34d399;stroke-width:3;fill:none;marker-end:url(#arrowSense);stroke-linecap:round}
      .planned{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrowSense);stroke-dasharray:6 7;stroke-linecap:round;opacity:0.78}
      .control{stroke:#fb923c;stroke-width:3;fill:none;marker-end:url(#arrowControl);stroke-dasharray:9 8;stroke-linecap:round;opacity:0.68}
      .human{stroke:#f472b6;stroke-width:4;fill:none;marker-end:url(#arrowHuman);stroke-linecap:round}
      .motion{stroke:#e2e8f0;stroke-width:3.6;fill:none;marker-end:url(#arrowData);stroke-linecap:round;stroke-dasharray:10 8}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1325" cy="98" r="150" fill="#1d4ed8" opacity="0.14"/>
  <circle cx="238" cy="846" r="190" fill="#0f766e" opacity="0.18"/>
  <text x="78" y="82" class="title">Docking System Evolution</text>
  <text x="82" y="122" class="sub">A tangible target: observe the approach, advise the pilot, and gate any future control</text>

  <rect x="58" y="160" width="990" height="560" rx="28" class="panel"/>
  <text x="92" y="204" class="h">Coming Alongside The Dock</text>
  <text x="92" y="232" class="s">A Conquest-style test vessel, current telemetry, planned perception, and future control paths.</text>

  <rect x="92" y="262" width="914" height="394" rx="22" fill="url(#water)" opacity="0.88" stroke="#1e3a4a" stroke-width="1.5"/>
  <path d="M110 603 C238 540 360 524 518 548 C684 573 810 540 990 478 L990 656 L110 656 Z" fill="#083344" opacity="0.5"/>
  <path d="M122 382 C284 338 450 346 604 374 C752 401 864 388 986 338" stroke="#67e8f9" stroke-width="4" opacity="0.44" fill="none"/>
  <path d="M160 609 C296 548 430 530 586 556 C742 582 852 550 970 506" stroke="#99f6e4" stroke-width="4" opacity="0.38" fill="none"/>

  <g id="dock">
    <rect x="162" y="314" width="724" height="64" rx="10" fill="url(#dockWood)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="176" y="322" width="66" height="46" fill="#8a5528" opacity="0.7"/>
    <rect x="256" y="322" width="66" height="46" fill="#3b250f" opacity="0.45"/>
    <rect x="336" y="322" width="66" height="46" fill="#8a5528" opacity="0.7"/>
    <rect x="416" y="322" width="66" height="46" fill="#3b250f" opacity="0.45"/>
    <rect x="496" y="322" width="66" height="46" fill="#8a5528" opacity="0.7"/>
    <rect x="576" y="322" width="66" height="46" fill="#3b250f" opacity="0.45"/>
    <rect x="656" y="322" width="66" height="46" fill="#8a5528" opacity="0.7"/>
    <rect x="736" y="322" width="66" height="46" fill="#3b250f" opacity="0.45"/>
    <rect x="816" y="322" width="56" height="46" fill="#8a5528" opacity="0.7"/>
    <line x1="162" y1="330" x2="886" y2="330" stroke="#fbbf24" opacity="0.56"/>
    <line x1="162" y1="360" x2="886" y2="360" stroke="#fbbf24" opacity="0.4"/>
    <circle cx="178" cy="314" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="388" cy="314" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="608" cy="314" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="870" cy="314" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="178" cy="378" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="388" cy="378" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="608" cy="378" r="13" fill="#422006" stroke="#fbbf24"/>
    <circle cx="870" cy="378" r="13" fill="#422006" stroke="#fbbf24"/>
    <text x="804" y="308" class="h2">Dock</text>
  </g>

  <g id="distance">
    <path d="M302 386 L302 468" class="planned"/>
    <path d="M478 386 L478 460" class="planned"/>
    <path d="M656 386 L656 460" class="planned"/>
    <path d="M798 386 L798 482" class="planned"/>
    <text x="662" y="410" class="tiny">planned dock range</text>
  </g>

  <g id="boat" opacity="0.7" transform="translate(125 180) scale(0.74)">
    <path d="M190 515 C212 462 260 428 334 414 L644 404 C738 407 806 430 846 471 C818 519 762 547 674 554 L284 552 C232 548 202 535 190 515 Z" fill="url(#darkHull)" stroke="#66758a" stroke-width="3" filter="url(#shadow)"/>
    <path d="M216 506 C258 474 330 456 438 451 L660 444 C728 445 776 456 806 474 C773 494 725 506 658 511 L320 516 C270 516 236 512 216 506 Z" fill="#0a1a2a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M264 539 C380 548 565 548 690 535" stroke="#9ca3af" stroke-width="6" opacity="0.7" fill="none"/>
    <path d="M278 430 C330 405 386 394 454 391 L650 387 C718 388 776 404 820 436" stroke="#cbd5e1" stroke-width="5" opacity="0.78" fill="none"/>
    <path d="M333 410 L384 388 L744 388 L806 422" stroke="#d1d5db" stroke-width="4" opacity="0.75" fill="none"/>

    <path d="M432 356 L610 350 L696 392 L676 438 L424 438 Z" fill="#e5edf5" opacity="0.46" stroke="#93c5fd" stroke-width="2.4"/>
    <path d="M456 374 L540 366 L612 392 L592 420 L450 420 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M616 390 L672 410 L654 430 L604 420 Z" fill="#102235" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="526" y="392" width="82" height="40" rx="8" fill="#071827" stroke="#34d399" stroke-width="2"/>
    <rect x="538" y="402" width="24" height="16" rx="3" fill="#38bdf8"/>
    <rect x="570" y="402" width="28" height="16" rx="3" fill="#fbbf24"/>
    <text x="523" y="459" class="tiny">helm + plotters</text>

    <path d="M450 346 C482 314 562 308 612 344" stroke="#e2e8f0" stroke-width="6" opacity="0.78" fill="none" stroke-linecap="round"/>
    <rect x="458" y="326" width="190" height="18" rx="7" fill="#dbeafe" opacity="0.64" stroke="#f8fafc" stroke-width="2"/>
    <ellipse cx="560" cy="306" rx="46" ry="14" fill="#dbeafe" opacity="0.7" stroke="#f8fafc" stroke-width="2"/>
    <path d="M612 318 L670 286" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <path d="M504 318 L486 282" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <text x="502" y="289" class="tiny">radar / camera class</text>

    <g id="pilot">
      <path d="M612 454 C616 428 626 416 640 416 C655 416 667 429 672 454 Z" fill="#203047" stroke="#cbd5e1" stroke-width="1.8"/>
      <path d="M622 445 C630 436 642 434 653 441 L666 454 L610 454 Z" fill="#d9e5f2" opacity="0.78"/>
      <circle cx="640" cy="401" r="14" fill="#e3b17c" stroke="#fff7ed" stroke-width="2.2"/>
      <path d="M628 394 C634 382 650 382 658 394 L656 398 C647 394 637 394 629 399 Z" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M654 393 L674 397" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
      <path d="M650 424 C661 420 668 416 675 409" stroke="#e3b17c" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="676" cy="408" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="606" y="439" width="19" height="26" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="606" y="482" class="tiny">pilot</text>
    </g>

    <rect x="130" y="468" width="42" height="72" rx="11" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <rect x="176" y="466" width="42" height="74" rx="11" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <path d="M130 541 C148 552 160 552 172 541" stroke="#fb923c" stroke-width="7" fill="none"/>
    <path d="M176 541 C194 552 206 552 218 541" stroke="#fb923c" stroke-width="7" fill="none"/>
    <text x="122" y="548" class="tiny">twin outboards</text>

    <path d="M305 514 L690 504" stroke="#38bdf8" stroke-width="4" opacity="0.55" fill="none"/>
    <text x="360" y="532" class="tiny">CAN / NMEA 2000 backbone</text>
  </g>

  <g id="side-motion">
    <path d="M360 542 L360 402" class="motion"/>
    <path d="M522 536 L522 402" class="motion"/>
    <path d="M706 544 L706 402" class="motion"/>
    <text x="392" y="420" class="tiny" fill="#e2e8f0">side approach to the dock</text>
  </g>

  <g id="video-range">
    <path d="M714 500 C780 454 828 414 854 382" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 8" fill="none" opacity="0.46"/>
    <path d="M710 548 C800 492 844 432 870 382" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 8" fill="none" opacity="0.46"/>
    <path d="M334 518 C268 458 226 412 198 382" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 8" fill="none" opacity="0.46"/>
    <text x="744" y="578" class="tiny">planned video / range</text>
  </g>

  <g id="sensor-chips">
    <rect x="118" y="270" width="118" height="32" rx="11" class="chip"/><text x="137" y="291" class="mono">GPS</text>
    <rect x="252" y="270" width="126" height="32" rx="11" class="chip"/><text x="272" y="291" class="mono">speed</text>
    <rect x="394" y="270" width="126" height="32" rx="11" class="chip"/><text x="414" y="291" class="mono">depth</text>
    <rect x="536" y="270" width="118" height="32" rx="11" class="plannedChip"/><text x="551" y="291" class="mono">wind class</text>
    <rect x="118" y="614" width="174" height="32" rx="11" class="chip"/><text x="137" y="635" class="mono">engine RPM</text>
    <rect x="308" y="614" width="184" height="32" rx="11" class="plannedChip"/><text x="327" y="635" class="mono">dock range</text>
    <rect x="508" y="614" width="170" height="32" rx="11" class="plannedChip"/><text x="527" y="635" class="mono">video feeds</text>
  </g>

  <path d="M176 302 C206 372 242 455 300 520" class="sense"/>
  <path d="M314 302 C360 380 444 458 520 486" class="sense"/>
  <path d="M458 302 C472 365 490 425 512 480" class="sense"/>
  <path d="M594 302 C594 350 590 398 572 444" class="planned"/>
  <path d="M206 614 C202 586 196 570 186 548" class="sense"/>
  <path d="M400 614 C514 582 642 542 798 430" class="planned"/>
  <path d="M594 614 C658 572 712 528 756 490" class="planned"/>

  <path d="M690 436 C836 362 1000 330 1110 340" class="data"/>
  <path d="M656 550 C850 596 1004 594 1110 548" class="data"/>
  <text x="865" y="326" class="tiny">sensor data in</text>
  <text x="850" y="594" class="tiny">replay and inspection</text>

  <rect x="1090" y="160" width="450" height="560" rx="28" class="panel"/>
  <text x="1126" y="204" class="h">Cluster, Gate, And Pilot</text>
  <text x="1126" y="232" class="s">The cluster sees; the captain authorizes; control remains gated.</text>

  <rect x="1126" y="268" width="378" height="116" rx="22" fill="url(#cluster)" filter="url(#shadow)"/>
  <text x="1156" y="310" class="h2">Edge Cluster</text>
  <text x="1156" y="340" class="s" style="fill:#eef2ff">CAN/NMEA 2000 ingest,</text>
  <text x="1156" y="366" class="s" style="fill:#eef2ff">replay and inspection</text>

  <rect x="1126" y="408" width="172" height="94" rx="18" fill="#0b1f31" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="1152" y="440" class="h2">Data In</text>
  <text x="1152" y="468" class="tiny">GPS, speed, depth</text>
  <text x="1152" y="490" class="tiny">RPM, temp, battery/fuel</text>

  <rect x="1332" y="408" width="172" height="94" rx="18" fill="#28162a" stroke="#f472b6" stroke-width="1.6"/>
  <text x="1354" y="440" class="h2">Pilot Gate</text>
  <text x="1354" y="468" class="tiny">enable, monitor</text>
  <text x="1354" y="490" class="tiny">override, approve</text>

  <rect x="1126" y="532" width="378" height="120" rx="22" fill="#1f1308" stroke="#fb923c" stroke-width="1.6"/>
  <text x="1156" y="572" class="h2">Future Gated Outputs</text>
  <text x="1156" y="604" class="s">estimates + advisory</text>
  <text x="1156" y="632" class="s">throttle / angle requests</text>
  <text x="1354" y="604" class="s">emergency hold</text>
  <text x="1354" y="632" class="s">safe-state limits</text>

  <path d="M1298 456 C1314 456 1318 456 1332 456" class="human"/>
  <path d="M1315 384 C1315 394 1315 398 1315 408" class="data"/>
  <path d="M1418 502 C1418 518 1400 522 1400 532" class="human"/>
  <path d="M1126 592 C962 654 706 682 538 610" class="control"/>
  <path d="M1126 624 C904 710 396 708 210 586" class="control"/>
  <text x="790" y="692" class="tiny">future control path, not current public claim</text>
  <text x="386" y="694" class="tiny">throttle</text>
  <text x="222" y="568" class="tiny">steering angle</text>

  <rect x="58" y="760" width="1482" height="170" rx="28" class="panel"/>
  <text x="92" y="806" class="h">Capability Evolution</text>
  <text x="92" y="834" class="s">Authority grows only after evidence, replay, safety review, and owner approval.</text>

  <g id="evolution">
    <rect x="92" y="862" width="250" height="52" rx="15" fill="#0b2a55" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="116" y="884" class="h2">Status + Replay</text>
    <text x="116" y="904" class="tiny">current public surface</text>
    <path d="M342 888 L388 888" class="data"/>
    <rect x="408" y="862" width="250" height="52" rx="15" fill="#073b37" stroke="#34d399" stroke-width="1.6"/>
    <text x="432" y="884" class="h2">Advisory Cues</text>
    <text x="432" y="904" class="tiny">next: pilot information</text>
    <path d="M658 888 L704 888" class="data"/>
    <rect x="724" y="862" width="250" height="52" rx="15" fill="#2b174c" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="748" y="884" class="h2">Shadow Requests</text>
    <text x="748" y="904" class="tiny">future: predict, no influence</text>
    <path d="M974 888 L1020 888" class="control"/>
    <rect x="1040" y="862" width="210" height="52" rx="15" fill="#45220a" stroke="#fb923c" stroke-width="1.6"/>
    <text x="1064" y="884" class="h2">Emergency Assist</text>
    <text x="1064" y="904" class="tiny">future gated control</text>
    <path d="M1250 888 L1296 888" class="control"/>
    <rect x="1316" y="862" width="188" height="52" rx="15" fill="#45132e" stroke="#f472b6" stroke-width="1.6"/>
    <text x="1340" y="884" class="h2">Full Docking R&amp;D</text>
    <text x="1340" y="904" class="tiny">not a current claim</text>
  </g>

  <rect x="92" y="938" width="1412" height="34" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1.4"/>
  <text x="116" y="960" class="tiny">Solid blue/green: current observations. Dashed gray/yellow: planned perception classes. Dashed orange: future owner-gated control requests.</text>
</svg>
