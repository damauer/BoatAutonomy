<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy market and business fit</title>
  <desc id="desc">A dark public-safe graphic showing the path from docking stress to instrumented survey, replay, twin inputs, supervised assist research, and adjacent edge-autonomy opportunities.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#2b1607"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker><style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}.line{stroke:#f97316;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Market Vision, Held With Restraint</text><text x="82" y="126" class="sub">The emotional problem is real; the public claim stays bounded until evidence earns more</text>
  <rect x="95" y="210" width="310" height="235" rx="26" class="panel"/><text x="135" y="260" class="h">Docking Stress</text><text x="135" y="302" class="s">close quarters, wind, current,</text><text x="135" y="330" class="s">crew coordination, spectators,</text><text x="135" y="358" class="s">and costly mistakes</text>
  <rect x="505" y="210" width="310" height="235" rx="26" class="panel"/><text x="545" y="260" class="h">Trust Builders</text><text x="545" y="302" class="s">instrumented survey, replay,</text><text x="545" y="330" class="s">twin inputs, training, and</text><text x="545" y="358" class="s">evidence before authority</text>
  <rect x="915" y="210" width="310" height="235" rx="26" class="panel"/><text x="955" y="260" class="h">Possible Products</text><text x="955" y="302" class="s">owner coaching, survey tools,</text><text x="955" y="330" class="s">retrofit observability, and</text><text x="955" y="358" class="s">assist research when earned</text>
  <rect x="1325" y="210" width="180" height="235" rx="26" class="panel"/><text x="1360" y="260" class="h">Not Yet</text><text x="1360" y="302" class="s">no launch</text><text x="1360" y="330" class="s">no funding</text><text x="1360" y="358" class="s">no readiness</text>
  <path d="M405 328 L505 328" class="line"/><path d="M815 328 L915 328" class="line"/><path d="M1225 328 L1325 328" class="line"/>
  <rect x="135" y="560" width="390" height="150" rx="24" fill="#073b37" stroke="#34d399" stroke-width="1.6" filter="url(#shadow)"/><text x="175" y="610" class="h">Recreational Boaters</text><text x="175" y="650" class="s">calmer maneuvers and better feedback</text>
  <rect x="605" y="560" width="390" height="150" rx="24" fill="#0b2a55" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadow)"/><text x="645" y="610" class="h">Marine Services</text><text x="645" y="650" class="s">survey, diagnostics, twin-informed review</text>
  <rect x="1075" y="560" width="390" height="150" rx="24" fill="#2b174c" stroke="#a78bfa" stroke-width="1.6" filter="url(#shadow)"/><text x="1115" y="610" class="h">Adjacent Edge Autonomy</text><text x="1115" y="650" class="s">replay-first patterns for physical systems</text>
  <rect x="95" y="805" width="1410" height="70" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.6"/><text x="135" y="848" class="h">The market story is compelling because restraint makes the ambition credible.</text>
</svg>
