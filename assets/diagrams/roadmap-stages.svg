<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy staged roadmap</title>
  <desc id="desc">A dark public-safe roadmap graphic showing progression from governance and passive telemetry through replay, estimation, shadow mode, supervised assist, and higher autonomy research.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.6" stop-color="#111827"/><stop offset="1" stop-color="#06251f"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.line{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrow)}.card{filter:url(#shadow);stroke-width:1.6}</style></defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Capability Roadmap</text><text x="82" y="126" class="sub">Capability order, not delivery promises: each stage earns the right to support the next</text>
  <path d="M155 430 L1440 430" class="line"/>
  <g><rect x="95" y="300" width="180" height="190" rx="22" fill="#0f172a" stroke="#38bdf8" class="card"/><text x="135" y="350" class="h">0 Govern</text><text x="125" y="388" class="s">roles, evidence,</text><text x="125" y="414" class="s">approval gates</text></g>
  <g><rect x="305" y="300" width="180" height="190" rx="22" fill="#073b37" stroke="#34d399" class="card"/><text x="345" y="350" class="h">1 Capture</text><text x="335" y="388" class="s">passive telemetry,</text><text x="335" y="414" class="s">no writes</text></g>
  <g><rect x="515" y="300" width="180" height="190" rx="22" fill="#0b2a55" stroke="#38bdf8" class="card"/><text x="555" y="350" class="h">2 Replay</text><text x="545" y="388" class="s">dashboards, tests,</text><text x="545" y="414" class="s">repeatability</text></g>
  <g><rect x="725" y="300" width="180" height="190" rx="22" fill="#2b174c" stroke="#a78bfa" class="card"/><text x="755" y="350" class="h">3 Estimate</text><text x="755" y="388" class="s">state from sensors,</text><text x="755" y="414" class="s">compare to replay</text></g>
  <g><rect x="935" y="300" width="180" height="190" rx="22" fill="#45220a" stroke="#f97316" class="card"/><text x="980" y="350" class="h">4 Shadow</text><text x="965" y="388" class="s">predict requests,</text><text x="965" y="414" class="s">do not influence</text></g>
  <g><rect x="1145" y="300" width="180" height="190" rx="22" fill="#45132e" stroke="#f472b6" class="card"/><text x="1175" y="350" class="h">5 Assist</text><text x="1175" y="388" class="s">bounded, enabled,</text><text x="1175" y="414" class="s">override-ready</text></g>
  <g><rect x="1355" y="300" width="150" height="190" rx="22" fill="#111827" stroke="#94a3b8" class="card"/><text x="1392" y="350" class="h">6 R&amp;D</text><text x="1380" y="388" class="s">higher autonomy</text><text x="1380" y="414" class="s">remains research</text></g>
  <rect x="130" y="690" width="1340" height="82" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.6" filter="url(#shadow)"/><text x="170" y="742" class="h">Takeaway: the roadmap is a sequence of evidence gates, not a promise that autonomy is already finished.</text>
</svg>
