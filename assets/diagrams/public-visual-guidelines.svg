<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy public visual direction</title>
  <desc id="desc">A dark, color-forward public-safe visual guideline: less copy, one visual takeaway per page, scan-fast graphics that invite deeper inspection, dark backgrounds, clear public boundary, and exceptions for formal documents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#06251f"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.48" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .section { font: 800 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .label { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; letter-spacing: 0; }
      .panel { fill: #111827; stroke: #243244; stroke-width: 1.6; rx: 24; filter: url(#shadow); }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 20; }
      .chip-blue { fill: #0b2a55; stroke: #38bdf8; stroke-width: 1.6; rx: 16; }
      .chip-teal { fill: #073b37; stroke: #34d399; stroke-width: 1.6; rx: 16; }
      .chip-orange { fill: #45220a; stroke: #f97316; stroke-width: 1.6; rx: 16; }
      .chip-purple { fill: #2b174c; stroke: #a78bfa; stroke-width: 1.6; rx: 16; }
      .chip-pink { fill: #45132e; stroke: #f472b6; stroke-width: 1.6; rx: 16; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1328" cy="130" r="175" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="245" cy="725" r="210" fill="#0f766e" opacity="0.22"/>
  <circle cx="1390" cy="760" r="130" fill="#f97316" opacity="0.16"/>

  <text x="80" y="92" class="title">Public Visual Direction</text>
  <text x="82" y="132" class="subtitle">Less copy, one visual takeaway, scan-fast substance, dark color-forward assets, and explicit public boundaries</text>

  <rect x="92" y="180" width="1416" height="560" class="panel"/>
  <rect x="130" y="220" width="460" height="210" rx="28" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="168" y="278" class="section">Design Rule</text>
  <text x="168" y="324" class="title" style="font-size:42px">Less Is More</text>
  <text x="168" y="366" class="small" style="fill:#eef2ff">A quick scan reveals the point.</text>
  <text x="168" y="394" class="small" style="fill:#eef2ff">Credible detail invites a deeper read.</text>

  <rect x="655" y="220" width="375" height="210" class="card"/>
  <text x="695" y="270" class="label">One Visual Takeaway</text>
  <text x="695" y="314" class="small">Every narrative page gets a</text>
  <text x="695" y="342" class="small">diagram, dashboard, map,</text>
  <text x="695" y="370" class="small">timeline, or compact visual.</text>

  <rect x="1095" y="220" width="375" height="210" class="card"/>
  <text x="1135" y="270" class="label">Dark + Color</text>
  <text x="1135" y="314" class="small">Prefer dark-background visuals</text>
  <text x="1135" y="342" class="small">with disciplined color accents.</text>
  <text x="1135" y="370" class="small">Avoid black text on white.</text>

  <rect x="130" y="480" width="300" height="170" class="chip-blue"/>
  <text x="166" y="530" class="label">Invite Inspection</text>
  <text x="166" y="570" class="small">Make the takeaway obvious,</text>
  <text x="166" y="598" class="small">then hint at real depth.</text>

  <rect x="475" y="480" width="300" height="170" class="chip-teal"/>
  <text x="511" y="530" class="label">Keep Pages Focused</text>
  <text x="511" y="570" class="small">One page, one job.</text>
  <text x="511" y="598" class="small">Fold duplicates together.</text>

  <rect x="820" y="480" width="300" height="170" class="chip-orange"/>
  <text x="856" y="530" class="label">Stay Public-Safe</text>
  <text x="856" y="570" class="small">Use synthetic, redacted,</text>
  <text x="856" y="598" class="small">or abstracted evidence.</text>

  <rect x="1165" y="480" width="300" height="170" class="chip-purple"/>
  <text x="1201" y="530" class="label">Name Exceptions</text>
  <text x="1201" y="570" class="small">Resume, license, notice,</text>
  <text x="1201" y="598" class="small">and legal text can stay plain.</text>

  <rect x="92" y="780" width="1416" height="58" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="816" class="tiny">Working note: existing light diagrams are acceptable drafts; new or revised visuals should move toward this darker, color-forward style.</text>
</svg>
