<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy professional signal</title>
  <desc id="desc">A dark public-safe graphic connecting embedded systems, cloud and DevOps, network digital-twin method, commercial judgment, and governed AI-assisted engineering to BoatAutonomy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#06251f"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="0.48" stop-color="#0f766e"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter><style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}</style></defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Professional Signal</text><text x="82" y="126" class="sub">A career pattern made public-safe: observe, model, validate, then promote</text>
  <rect x="550" y="245" width="500" height="250" rx="32" fill="url(#core)" filter="url(#shadow)"/><text x="612" y="300" class="h">BoatAutonomy</text><text x="612" y="342" class="s" style="fill:#eef2ff">A real physical-system target that combines</text><text x="612" y="370" class="s" style="fill:#eef2ff">telemetry, replay, evolving twin inputs,</text><text x="612" y="398" class="s" style="fill:#eef2ff">governance, agentic delivery, and safety.</text><text x="612" y="432" class="s" style="fill:#eef2ff">Current twin: electronics/network. Motion later.</text>
  <rect x="90" y="210" width="360" height="155" rx="24" class="panel"/><text x="128" y="258" class="h">Embedded + Protocols</text><text x="128" y="300" class="s">networks, sensors, observed behavior,</text><text x="128" y="326" class="s">signal interpretation</text>
  <rect x="1150" y="210" width="360" height="155" rx="24" class="panel"/><text x="1188" y="258" class="h">Cloud + DevOps</text><text x="1188" y="300" class="s">AWS, Kubernetes, IaC, CI/CD,</text><text x="1188" y="326" class="s">recovery, operations</text>
  <rect x="90" y="530" width="360" height="155" rx="24" class="panel"/><text x="128" y="578" class="h">Digital-Twin Method</text><text x="128" y="620" class="s">telemetry, baseline, what-if,</text><text x="128" y="646" class="s">live-vs-expected</text>
  <rect x="1150" y="530" width="360" height="155" rx="24" class="panel"/><text x="1188" y="578" class="h">Governed AI Delivery</text><text x="1188" y="620" class="s">roles, reviews, evidence,</text><text x="1188" y="646" class="s">approval gates, restraint</text>
  <rect x="210" y="800" width="1180" height="70" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.6"/><text x="250" y="842" class="h">The project turns hard-systems judgment into a public-safe, inspectable example.</text>
</svg>
