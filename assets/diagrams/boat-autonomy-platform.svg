<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy platform pattern</title>
  <desc id="desc">A public-safe diagram showing BoatAutonomy as a staged platform from marine telemetry and replay through edge operations, agentic engineering, and safety-bounded assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <style>
      .title { font: 800 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .section { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .section-light { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label-light { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .small-light { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e0f2fe; letter-spacing: 0; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .04em; text-transform: uppercase; }
      .card { fill: #ffffff; stroke: #dbe7ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .soft { fill: #f8fafc; stroke: #dbe7ef; stroke-width: 2; rx: 18; }
      .dash { fill: #fff7ed; stroke: #fb923c; stroke-width: 2.4; stroke-dasharray: 8 8; rx: 18; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-teal { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow-teal); }
      .line-orange { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1370" cy="150" r="150" fill="#dbeafe" opacity="0.55"/>
  <circle cx="210" cy="810" r="170" fill="#ccfbf1" opacity="0.45"/>
  <circle cx="1410" cy="820" r="110" fill="#fed7aa" opacity="0.38"/>

  <text x="80" y="86" class="title">BoatAutonomy Platform Pattern</text>
  <text x="82" y="126" class="subtitle">Marine assistance research with replay, governed agents, edge operations, and safety-bounded autonomy</text>

  <rect x="80" y="175" width="325" height="290" class="card"/>
  <text x="110" y="220" class="section">Market Reality</text>
  <text x="110" y="255" class="small">Docking turns pleasure into pressure.</text>
  <text x="110" y="280" class="small">Wind, current, visibility, crew timing,</text>
  <text x="110" y="305" class="small">close quarters, and cost converge.</text>
  <path d="M132 388 C178 350 269 350 318 390 L296 416 L149 416 Z" fill="#2563eb"/>
  <path d="M166 358 L214 318 L262 358 Z" fill="#f97316"/>
  <path d="M92 432 C160 449 283 449 373 428" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="348" class="tiny">First use case</text>
  <text x="110" y="455" class="label">Calmer close-quarters boating</text>

  <rect x="475" y="175" width="650" height="290" rx="26" fill="url(#core)" filter="url(#shadow)"/>
  <text x="510" y="220" class="section-light">Replay And Evidence Core</text>
  <text x="510" y="254" class="small-light">Trust grows through recording, replay, review, and evidence gates.</text>

  <rect x="515" y="290" width="130" height="110" class="soft"/>
  <text x="538" y="327" class="label">Capture</text>
  <text x="536" y="355" class="small">Marine</text>
  <text x="536" y="378" class="small">signals</text>

  <rect x="670" y="290" width="150" height="110" class="soft"/>
  <text x="697" y="327" class="label">Normalize</text>
  <text x="695" y="355" class="small">Telemetry</text>
  <text x="695" y="378" class="small">events</text>

  <rect x="845" y="290" width="130" height="110" class="soft"/>
  <text x="875" y="327" class="label">Replay</text>
  <text x="867" y="355" class="small">Sessions</text>
  <text x="867" y="378" class="small">and tests</text>

  <rect x="1000" y="290" width="90" height="110" class="soft"/>
  <text x="1016" y="327" class="label">Gate</text>
  <text x="1017" y="355" class="small">Review</text>
  <text x="1017" y="378" class="small">evidence</text>

  <path d="M645 345 L670 345" class="line-blue"/>
  <path d="M820 345 L845 345" class="line-blue"/>
  <path d="M975 345 L1000 345" class="line-blue"/>

  <rect x="1195" y="175" width="325" height="290" class="card"/>
  <text x="1225" y="220" class="section">Assistance Path</text>
  <text x="1225" y="255" class="small">Market vision: awareness, coaching,</text>
  <text x="1225" y="280" class="small">shadow mode, then future supervised</text>
  <text x="1225" y="305" class="small">assist only after evidence gates.</text>
  <rect x="1230" y="332" width="240" height="48" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1280" y="363" class="label">Owner in command</text>
  <rect x="1230" y="396" width="240" height="48" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text x="1258" y="427" class="label">Supervised assist (future)</text>

  <path d="M405 320 C430 320 445 320 475 320" class="line-teal"/>
  <path d="M1125 320 C1150 320 1165 320 1195 320" class="line-blue"/>

  <rect x="80" y="515" width="440" height="205" class="card"/>
  <text x="110" y="560" class="section">Edge And Cloud-To-Edge Ops</text>
  <text x="110" y="596" class="small">Repeatable environments for lab, staging,</text>
  <text x="110" y="621" class="small">production-like, and field-style workflows.</text>
  <rect x="113" y="650" width="102" height="42" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="139" y="677" class="small">Edge</text>
  <rect x="235" y="650" width="122" height="42" rx="12" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="259" y="677" class="small">Kubernetes</text>
  <rect x="377" y="650" width="105" height="42" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="396" y="677" class="small">Recovery</text>

  <rect x="580" y="515" width="440" height="205" class="card"/>
  <text x="610" y="560" class="section">Governed Agentic Engineering</text>
  <text x="610" y="596" class="small">Agents are useful because roles, evidence,</text>
  <text x="610" y="621" class="small">and owner approvals are explicit.</text>
  <rect x="615" y="650" width="88" height="42" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="635" y="677" class="small">Research</text>
  <rect x="720" y="650" width="78" height="42" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="745" y="677" class="small">Build</text>
  <rect x="815" y="650" width="84" height="42" rx="12" fill="#ffedd5" stroke="#fdba74"/>
  <text x="836" y="677" class="small">Review</text>
  <rect x="916" y="650" width="72" height="42" rx="12" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="934" y="677" class="small">Gate</text>

  <rect x="1080" y="515" width="440" height="205" class="dash"/>
  <text x="1110" y="560" class="section">Safety Boundary</text>
  <text x="1110" y="596" class="small">Models and clusters can support awareness,</text>
  <text x="1110" y="621" class="small">but they do not receive direct actuator authority.</text>
  <text x="1110" y="665" class="label">Human enable + physical override</text>
  <text x="1110" y="695" class="small">Deterministic limits before any future assist.</text>

  <path d="M520 618 C545 618 555 618 580 618" class="line-teal"/>
  <path d="M1020 618 C1045 618 1055 618 1080 618" class="line-orange"/>
  <path d="M800 465 L800 515" class="line-blue"/>

  <rect x="80" y="775" width="1440" height="130" rx="26" fill="#ffffff" stroke="#dbe7ef" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="823" class="section">Transferable Value</text>
  <text x="110" y="860" class="small">The first market is recreational boating. The reusable pattern is broader:</text>
  <text x="110" y="891" class="label">telemetry + replay + edge operations + governed AI + safety-bounded assistance</text>

  <rect x="748" y="813" width="145" height="42" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="773" y="840" class="small">Boating</text>
  <rect x="913" y="813" width="150" height="42" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <text x="934" y="840" class="small">Marine service</text>
  <rect x="1083" y="813" width="152" height="42" rx="14" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1108" y="840" class="small">Field robotics</text>
  <rect x="1255" y="813" width="220" height="42" rx="14" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="1280" y="840" class="small">Industrial telemetry</text>

  <text x="1230" y="946" class="tiny">Public-safe diagram</text>
</svg>
