<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BoatAutonomy agentic collaboration harness</title>
  <desc id="desc">A public-safe diagram showing Claude Code, Codex, and Grok collaboration loops, observable tmux sessions, GitLab work records, local and edge GitLab repositories, GitLab.com backup, and GitHub mirror.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 800 50px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 0; }
      .section { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .section-light { font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .label { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label-light { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .small-light { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e0e7ff; letter-spacing: 0; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .04em; }
      .card { fill: #ffffff; stroke: #dbe7ef; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .core { fill: url(#core); rx: 26; filter: url(#shadow); }
      .chip-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.6; rx: 14; }
      .chip-purple { fill: #ede9fe; stroke: #a78bfa; stroke-width: 1.6; rx: 14; }
      .chip-teal { fill: #ccfbf1; stroke: #5eead4; stroke-width: 1.6; rx: 14; }
      .chip-orange { fill: #ffedd5; stroke: #fdba74; stroke-width: 1.6; rx: 14; }
      .chip-pink { fill: #fce7f3; stroke: #f9a8d4; stroke-width: 1.6; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-purple { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrow-purple); }
      .line-teal { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow-teal); }
      .dash { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1335" cy="145" r="155" fill="#dbeafe" opacity="0.55"/>
  <circle cx="245" cy="835" r="190" fill="#ccfbf1" opacity="0.45"/>
  <circle cx="1390" cy="840" r="120" fill="#ede9fe" opacity="0.5"/>

  <text x="80" y="82" class="title">Agentic Collaboration Harness</text>
  <text x="82" y="122" class="subtitle">Research, implementation, review, reconciliation, and evidence persistence across local, edge, and hosted Git</text>

  <rect x="100" y="170" width="300" height="185" class="card"/>
  <text x="130" y="214" class="section">Owner Intent</text>
  <text x="130" y="250" class="small">Scope, risk, approvals,</text>
  <text x="130" y="274" class="small">publication boundary, and</text>
  <text x="130" y="298" class="small">physical authority stay human.</text>

  <rect x="480" y="170" width="640" height="185" class="core"/>
  <text x="520" y="214" class="section-light">Implementation And Review Loop</text>
  <text x="520" y="250" class="small-light">Claude Code builds. Codex reviews.</text>
  <text x="520" y="274" class="small-light">Findings are reconciled until evidence and behavior line up.</text>

  <rect x="525" y="285" width="142" height="48" class="chip-blue"/>
  <text x="548" y="316" class="small">Claude Code</text>
  <rect x="704" y="285" width="106" height="48" class="chip-purple"/>
  <text x="733" y="316" class="small">tmux</text>
  <rect x="847" y="285" width="116" height="48" class="chip-orange"/>
  <text x="875" y="316" class="small">GitLab</text>
  <rect x="1000" y="285" width="82" height="48" class="chip-teal"/>
  <text x="1017" y="316" class="small">Codex</text>

  <path d="M667 309 L704 309" class="line-blue"/>
  <path d="M810 309 L847 309" class="line-blue"/>
  <path d="M963 309 L1000 309" class="line-blue"/>

  <rect x="1200" y="170" width="300" height="185" class="card"/>
  <text x="1230" y="214" class="section">Research And Models</text>
  <text x="1230" y="250" class="small">Grok explores domain context.</text>
  <text x="1230" y="274" class="small">Tower supports local LLM and</text>
  <text x="1230" y="298" class="small">model-training experiments.</text>
  <rect x="1230" y="316" width="222" height="32" class="chip-teal"/>
  <text x="1266" y="338" class="small">Tower model lane</text>

  <path d="M400 260 C430 260 448 260 480 260" class="line-blue"/>
  <path d="M1120 260 C1150 260 1168 260 1200 260" class="line-purple"/>

  <rect x="100" y="430" width="300" height="220" class="card"/>
  <text x="130" y="475" class="section">Observable Work</text>
  <text x="130" y="510" class="small">tmux sessions make long-running</text>
  <text x="130" y="534" class="small">agent work visible, resumable,</text>
  <text x="130" y="558" class="small">and reviewable.</text>
  <rect x="130" y="594" width="220" height="42" class="chip-purple"/>
  <text x="169" y="621" class="small">session evidence</text>

  <rect x="480" y="430" width="300" height="220" class="card"/>
  <text x="510" y="475" class="section">Work Records</text>
  <text x="510" y="510" class="small">Merge requests, tasks,</text>
  <text x="510" y="534" class="small">milestones, commits, reviews,</text>
  <text x="510" y="558" class="small">and reconciliation notes.</text>
  <rect x="510" y="594" width="104" height="42" class="chip-orange"/>
  <text x="538" y="621" class="small">MRs</text>
  <rect x="630" y="594" width="104" height="42" class="chip-orange"/>
  <text x="648" y="621" class="small">Tasks</text>

  <rect x="860" y="430" width="300" height="220" class="card"/>
  <text x="890" y="475" class="section">Review And Reconcile</text>
  <text x="890" y="510" class="small">Codex findings become fixes,</text>
  <text x="890" y="534" class="small">deferrals, blockers, or explicit</text>
  <text x="890" y="558" class="small">owner decisions.</text>
  <rect x="890" y="594" width="220" height="42" class="chip-teal"/>
  <text x="927" y="621" class="small">findings closed or carried</text>

  <rect x="1240" y="430" width="260" height="220" class="card"/>
  <text x="1270" y="475" class="section">Governance</text>
  <text x="1270" y="510" class="small">Policy keeps research,</text>
  <text x="1270" y="534" class="small">implementation, review,</text>
  <text x="1270" y="558" class="small">models, and approval distinct.</text>
  <rect x="1270" y="594" width="176" height="42" class="chip-pink"/>
  <text x="1303" y="621" class="small">owner gate</text>

  <path d="M250 355 C250 385 250 402 250 430" class="line-blue"/>
  <path d="M630 355 C630 385 630 402 630 430" class="line-blue"/>
  <path d="M1010 355 C1010 385 1010 402 1010 430" class="line-purple"/>
  <path d="M1350 355 C1350 385 1350 402 1350 430" class="line-purple"/>
  <path d="M400 540 L480 540" class="line-teal"/>
  <path d="M780 540 L860 540" class="line-teal"/>
  <path d="M1160 540 L1240 540" class="line-teal"/>
  <path d="M1010 650 C930 700 720 705 630 650" class="dash"/>
  <path d="M630 650 C555 700 335 705 250 650" class="dash"/>

  <rect x="100" y="760" width="1400" height="125" rx="26" fill="#ffffff" stroke="#dbe7ef" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="806" class="section">Evidence Persistence And Publication Path</text>
  <text x="130" y="840" class="small">Local and edge GitLab repos hold operational truth. GitLab.com backs up durable records. GitHub mirrors approved public-facing artifacts.</text>

  <rect x="140" y="865" width="210" height="46" class="chip-blue"/>
  <text x="178" y="895" class="small">Local GitLab</text>
  <rect x="385" y="865" width="205" height="46" class="chip-teal"/>
  <text x="422" y="895" class="small">Edge GitLab</text>
  <rect x="625" y="865" width="230" height="46" class="chip-orange"/>
  <text x="665" y="895" class="small">GitLab.com backup</text>
  <rect x="890" y="865" width="205" height="46" class="chip-purple"/>
  <text x="927" y="895" class="small">GitHub mirror</text>
  <rect x="1130" y="865" width="300" height="46" class="chip-pink"/>
  <text x="1168" y="895" class="small">Public facade after approval</text>

  <path d="M350 888 L385 888" class="line-teal"/>
  <path d="M590 888 L625 888" class="line-teal"/>
  <path d="M855 888 L890 888" class="line-teal"/>
  <path d="M1095 888 L1130 888" class="line-teal"/>

  <text x="1040" y="948" class="tiny">Public-safe: process shape, not private credentials or endpoints</text>
</svg>
