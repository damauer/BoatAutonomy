<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI and agentic collaboration harness</title>
  <desc id="desc">A dark public-safe diagram showing Claude Code, Codex, Grok, tmux, GitLab records, local model experiments, and publication boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#170b2c"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="0.52" stop-color="#7c3aed"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <style>.title{font:800 50px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.sub{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.label{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.s{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.panel{fill:#111827;stroke:#263244;stroke-width:1.6;filter:url(#shadow)}.line{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8;fill:none}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="82" class="title">AI And Agentic Collaboration</text>
  <text x="82" y="122" class="sub">Fast agents, visible work, independent review, and owner authority stay in separate lanes</text>

  <rect x="85" y="175" width="300" height="205" rx="24" class="panel"/>
  <text x="120" y="222" class="h">Owner Intent</text>
  <text x="120" y="260" class="s">Scope, risk, publication,</text><text x="120" y="286" class="s">and physical authority</text><text x="120" y="312" class="s">stay human.</text>

  <rect x="475" y="160" width="650" height="235" rx="30" fill="url(#core)" filter="url(#shadow)"/>
  <text x="520" y="212" class="h">Implementation And Review Loop</text>
  <text x="520" y="248" class="s" style="fill:#eef2ff">Claude builds. Codex reviews.</text>
  <text x="520" y="274" class="s" style="fill:#eef2ff">Findings become fixes, blockers, deferrals, or owner decisions.</text>
  <rect x="535" y="300" width="145" height="50" rx="15" fill="#0b2a55" stroke="#38bdf8" stroke-width="1.6"/><text x="561" y="331" class="s">Claude Code</text>
  <rect x="720" y="300" width="115" height="50" rx="15" fill="#2b174c" stroke="#a78bfa" stroke-width="1.6"/><text x="758" y="331" class="s">tmux</text>
  <rect x="875" y="300" width="125" height="50" rx="15" fill="#45220a" stroke="#f97316" stroke-width="1.6"/><text x="912" y="331" class="s">GitLab</text>
  <rect x="1040" y="300" width="75" height="50" rx="15" fill="#073b37" stroke="#34d399" stroke-width="1.6"/><text x="1055" y="331" class="s">Codex</text>

  <rect x="1215" y="175" width="300" height="205" rx="24" class="panel"/>
  <text x="1250" y="222" class="h">Research And Models</text>
  <text x="1250" y="260" class="s">Grok explores domain fit.</text><text x="1250" y="286" class="s">Local model work stays</text><text x="1250" y="312" class="s">in a private lane.</text>

  <path d="M385 278 C420 278 440 278 475 278" class="line"/><path d="M1125 278 C1160 278 1180 278 1215 278" class="line"/>

  <rect x="90" y="465" width="320" height="205" rx="24" class="panel"/><text x="125" y="512" class="h">Observable Work</text><text x="125" y="550" class="s">tmux makes long-running</text><text x="125" y="576" class="s">agent sessions visible,</text><text x="125" y="602" class="s">resumable, and reviewable.</text>
  <rect x="460" y="465" width="320" height="205" rx="24" class="panel"/><text x="495" y="512" class="h">Work Records</text><text x="495" y="550" class="s">Merge requests, tasks,</text><text x="495" y="576" class="s">milestones, commits,</text><text x="495" y="602" class="s">reviews, and decisions.</text>
  <rect x="830" y="465" width="320" height="205" rx="24" class="panel"/><text x="865" y="512" class="h">Reconciliation</text><text x="865" y="550" class="s">Findings are closed,</text><text x="865" y="576" class="s">carried, blocked, or</text><text x="865" y="602" class="s">explicitly accepted.</text>
  <rect x="1200" y="465" width="315" height="205" rx="24" class="panel"/><text x="1235" y="512" class="h">Governance</text><text x="1235" y="550" class="s">Research, implementation,</text><text x="1235" y="576" class="s">review, model experiments,</text><text x="1235" y="602" class="s">and approval remain distinct.</text>
  <path d="M410 568 L460 568" class="line"/><path d="M780 568 L830 568" class="line"/><path d="M1150 568 L1200 568" class="line"/>
  <path d="M995 465 C950 420 820 410 770 465" class="dash"/><path d="M620 465 C560 420 360 420 250 465" class="dash"/>

  <rect x="110" y="760" width="1390" height="120" rx="26" fill="#0f172a" stroke="#334155" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="145" y="808" class="h">Agent speed is useful because work stays observable, reviewed, reconciled, and gated.</text>
  <text x="145" y="842" class="s">Local/edge GitLab holds operational truth. Hosted backup preserves durable records. GitHub mirrors only approved public artifacts.</text>
  <text x="145" y="872" class="tiny">Evidence persistence and publication boundaries are part of the engineering system.</text>
</svg>
