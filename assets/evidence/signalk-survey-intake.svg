<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SignalK survey intake mockup</title>
  <desc id="desc">A public-safe dark visual showing a SignalK-style data browser, redacted DSM410 device-list survey evidence, and the path from survey artifacts to replay and digital-twin inputs.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.48" stop-color="#10263a"/>
      <stop offset="1" stop-color="#0b2f2b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2b"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202a"/>
      <stop offset="0.55" stop-color="#0c1118"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <rect y="0" width="6" height="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#67e8f9" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .h { font: 800 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .m { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; letter-spacing: 0; }
      .s { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; letter-spacing: 0; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dbeafe; letter-spacing: 0; }
      .code-dim { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #93c5fd; letter-spacing: 0; }
      .device { font: 800 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc; letter-spacing: 0; }
      .lcd { font: 800 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc; letter-spacing: 0; }
      .lcd-small { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #cbd5e1; letter-spacing: 0; }
      .panel { fill: url(#panel); stroke: #274156; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .chip { fill: #14243a; stroke: #2b4860; stroke-width: 1.2; rx: 12; }
      .row { fill: #0b1626; stroke: #22364c; stroke-width: 1; rx: 8; }
      .row2 { fill: #102338; stroke: #2b4860; stroke-width: 1; rx: 8; }
      .good { fill: #34d399; }
      .warn { fill: #fbbf24; }
      .blue { fill: #38bdf8; }
      .orange { fill: #fb923c; }
      .line { stroke: url(#signal); stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <rect x="0" y="0" width="1600" height="72" fill="#050915" opacity="0.96"/>
  <circle cx="42" cy="36" r="13" fill="#38bdf8"/>
  <path d="M36 38 C42 25 47 28 49 36 C52 48 38 50 36 38 Z" fill="#fbbf24" opacity="0.92"/>
  <text x="70" y="45" class="title">SignalK Survey Intake</text>
  <text x="470" y="43" class="subtitle">live service shape, redacted device inventory, replay-ready telemetry paths</text>
  <rect x="1240" y="20" width="284" height="34" class="chip"/>
  <text x="1260" y="42" class="tiny">Public-safe: no raw IDs/endpoints</text>

  <rect x="58" y="104" width="1484" height="70" rx="16" fill="#0b1728" stroke="#274156" stroke-width="1.5"/>
  <text x="86" y="134" class="h">What The Survey Captured</text>
  <text x="86" y="158" class="s">A physical boat survey can be reduced to inspectable devices, normalized SignalK paths, replay data, and evidence for a developing twin.</text>
  <rect x="1148" y="124" width="160" height="30" class="chip"/>
  <text x="1166" y="144" class="tiny">passive capture</text>
  <rect x="1322" y="124" width="162" height="30" class="chip"/>
  <text x="1344" y="144" class="tiny">no bus writes</text>

  <rect x="58" y="206" width="842" height="542" class="panel"/>
  <text x="92" y="246" class="h">SignalK-Style Data Browser</text>
  <text x="92" y="272" class="s">A field/travel SignalK service shapes synthetic/redacted values like normalized intake paths.</text>

  <rect x="92" y="304" width="774" height="392" rx="18" fill="#07111f" stroke="#38bdf8" stroke-width="1.4"/>
  <rect x="92" y="304" width="774" height="44" rx="18" fill="#061629"/>
  <text x="124" y="333" style="font:800 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:0">Signal K</text>
  <text x="812" y="332" style="font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1;letter-spacing:0">Login</text>
  <rect x="92" y="348" width="166" height="348" fill="#0d2537"/>
  <text x="120" y="384" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1;letter-spacing:0">Dashboard</text>
  <text x="120" y="426" style="font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc;letter-spacing:0">Data</text>
  <rect x="92" y="444" width="166" height="42" fill="#12445f"/>
  <text x="132" y="471" style="font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffffff;letter-spacing:0">Browser</text>
  <text x="132" y="514" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1;letter-spacing:0">Sources</text>
  <text x="120" y="560" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1;letter-spacing:0">Documentation</text>
  <text x="120" y="602" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1;letter-spacing:0">Path Reference</text>

  <rect x="284" y="376" width="548" height="54" rx="12" fill="#0c1d31" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="306" y="400" style="font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#93c5fd;letter-spacing:0">Search paths</text>
  <text x="306" y="420" style="font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e0f2fe;letter-spacing:0">gps | speed | temp | depth | rpm | electrical</text>
  <g>
    <rect x="284" y="450" width="548" height="28" rx="8" fill="#0b1728" stroke="#25445f"/>
    <rect x="284" y="450" width="6" height="28" rx="3" fill="#38bdf8"/>
    <text x="306" y="469" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">navigation.position</text>
    <text x="704" y="469" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#38bdf8;letter-spacing:0">GPS fix</text>
    <rect x="284" y="482" width="548" height="28" rx="8" fill="#0f2338" stroke="#25445f"/>
    <rect x="284" y="482" width="6" height="28" rx="3" fill="#34d399"/>
    <text x="306" y="501" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">navigation.speedOverGround</text>
    <text x="704" y="501" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#34d399;letter-spacing:0">0.4 m/s</text>
    <rect x="284" y="514" width="548" height="28" rx="8" fill="#0b1728" stroke="#25445f"/>
    <rect x="284" y="514" width="6" height="28" rx="3" fill="#fbbf24"/>
    <text x="306" y="533" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">environment.water.temperature</text>
    <text x="704" y="533" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fbbf24;letter-spacing:0">28.0 C</text>
    <rect x="284" y="546" width="548" height="28" rx="8" fill="#0f2338" stroke="#25445f"/>
    <rect x="284" y="546" width="6" height="28" rx="3" fill="#22d3ee"/>
    <text x="306" y="565" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">environment.depth.belowTransducer</text>
    <text x="704" y="565" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#22d3ee;letter-spacing:0">4.8 m</text>
    <rect x="284" y="578" width="548" height="28" rx="8" fill="#0b1728" stroke="#25445f"/>
    <rect x="284" y="578" width="6" height="28" rx="3" fill="#fb923c"/>
    <text x="306" y="597" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">propulsion.engine.0.revolutions</text>
    <text x="704" y="597" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fb923c;letter-spacing:0">650 rpm</text>
    <rect x="284" y="610" width="548" height="28" rx="8" fill="#0f2338" stroke="#25445f"/>
    <rect x="284" y="610" width="6" height="28" rx="3" fill="#a78bfa"/>
    <text x="306" y="629" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">electrical.batteries.house.voltage</text>
    <text x="704" y="629" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#a78bfa;letter-spacing:0">12.7 V</text>
    <rect x="284" y="642" width="548" height="28" rx="8" fill="#0b1728" stroke="#25445f"/>
    <rect x="284" y="642" width="6" height="28" rx="3" fill="#f472b6"/>
    <text x="306" y="661" style="font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe;letter-spacing:0">tanks.fuel.currentLevel</text>
    <text x="704" y="661" style="font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f472b6;letter-spacing:0">62%</text>
  </g>

  <rect x="92" y="716" width="216" height="30" class="chip"/>
  <text x="110" y="736" class="tiny">SignalK v2.30 service</text>
  <rect x="324" y="716" width="196" height="30" class="chip"/>
  <text x="350" y="736" class="tiny">private data not shown</text>
  <rect x="536" y="716" width="254" height="30" class="chip"/>
  <text x="556" y="736" class="tiny">private values are not published</text>

  <rect x="930" y="206" width="612" height="542" class="panel"/>
  <text x="964" y="246" class="h">Maretron DSM410 Survey Reference</text>
  <text x="964" y="272" class="s">Redrawn from owner-supplied two-page device-selection photos; identifiers are withheld.</text>

  <g transform="translate(958 312) rotate(-4 0 0)">
    <rect x="0" y="0" width="258" height="292" rx="18" fill="url(#screen)" stroke="#526172" stroke-width="2" filter="url(#shadow)"/>
    <rect x="14" y="18" width="230" height="246" rx="10" fill="#05070a" stroke="#28323d"/>
    <rect x="14" y="18" width="230" height="246" rx="10" fill="url(#scanlines)" opacity="0.75"/>
    <text x="26" y="48" class="lcd">Device Selection</text>
    <text x="26" y="78" class="lcd-small">NA  Manufacturer  Model</text>
    <rect x="24" y="92" width="208" height="30" rx="3" fill="#e5e7eb" opacity="0.95"/>
    <text x="34" y="112" style="font:800 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;letter-spacing:0">-- Digital Yacht tool</text>
    <text x="34" y="144" class="lcd-small">-- Maretron recorder</text>
    <text x="34" y="174" class="lcd-small">-- Actisense interface</text>
    <text x="34" y="204" class="lcd-small">-- Mercury gateway</text>
    <text x="34" y="234" class="lcd-small">-- Raymarine display</text>
    <text x="28" y="274" class="lcd-small">page 1 / ids redacted</text>
  </g>

  <g transform="translate(1218 332) rotate(3 0 0)">
    <rect x="0" y="0" width="258" height="292" rx="18" fill="url(#screen)" stroke="#526172" stroke-width="2" filter="url(#shadow)"/>
    <rect x="14" y="18" width="230" height="246" rx="10" fill="#05070a" stroke="#28323d"/>
    <rect x="14" y="18" width="230" height="246" rx="10" fill="url(#scanlines)" opacity="0.75"/>
    <text x="26" y="48" class="lcd">Device Selection</text>
    <text x="26" y="78" class="lcd-small">NA  Manufacturer  Model</text>
    <rect x="24" y="92" width="208" height="30" rx="3" fill="#e5e7eb" opacity="0.95"/>
    <text x="34" y="112" style="font:800 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111827;letter-spacing:0">-- Fusion audio</text>
    <text x="34" y="144" class="lcd-small">-- Mercury display</text>
    <text x="34" y="174" class="lcd-small">-- Mercury display</text>
    <text x="34" y="204" class="lcd-small">-- Raymarine source</text>
    <text x="34" y="234" class="lcd-small">-- Raymarine source</text>
    <text x="28" y="274" class="lcd-small">page 2 / ids redacted</text>
  </g>

  <rect x="964" y="640" width="250" height="32" class="chip"/>
  <text x="984" y="661" class="tiny">two scrolled inventory pages</text>
  <rect x="1232" y="640" width="244" height="32" class="chip"/>
  <text x="1254" y="661" class="tiny">online/offline status preserved</text>
  <rect x="964" y="684" width="298" height="32" class="chip"/>
  <text x="984" y="705" class="tiny">exact serials and private rows withheld</text>
  <rect x="1280" y="684" width="196" height="32" class="chip"/>
  <text x="1308" y="705" class="tiny">unique IDs not published</text>

  <rect x="58" y="778" width="1484" height="154" class="panel"/>
  <text x="92" y="820" class="h">From Survey Artifact To Development Target</text>
  <g>
    <rect x="92" y="848" width="210" height="52" rx="14" fill="#0b1f31" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="128" y="880" class="m">Boat survey</text>
    <path d="M308 874 L392 874" class="line"/>
    <polygon points="392,874 374,862 374,886" fill="#34d399"/>
    <rect x="412" y="848" width="220" height="52" rx="14" fill="#0e2a26" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="880" class="m">Device inventory</text>
    <path d="M638 874 L722 874" class="line"/>
    <polygon points="722,874 704,862 704,886" fill="#34d399"/>
    <rect x="742" y="848" width="220" height="52" rx="14" fill="#221a0a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="784" y="880" class="m">SignalK paths</text>
    <path d="M968 874 L1052 874" class="line"/>
    <polygon points="1052,874 1034,862 1034,886" fill="#fbbf24"/>
    <rect x="1072" y="848" width="220" height="52" rx="14" fill="#25172f" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1116" y="880" class="m">Replay evidence</text>
    <path d="M1298 874 L1382 874" class="line"/>
    <polygon points="1382,874 1364,862 1364,886" fill="#c084fc"/>
    <rect x="1402" y="848" width="104" height="52" rx="14" fill="#13251d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="1427" y="872" class="s">Twin</text>
    <text x="1422" y="892" class="tiny">inputs</text>
  </g>
  <text x="92" y="920" class="s">A one-day physical survey becomes repeatable software input: inspect, replay, compare, and improve before scarce boat time is used again.</text>
</svg>
