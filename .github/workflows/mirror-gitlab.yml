name: Mirror to GitLab backup

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to gitlab.com/bbonz2020/BoatAutonomy
        run: |
          git push --prune "https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/bbonz2020/BoatAutonomy.git" \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
